<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Signal Post Messaging App</title><desc id="desc">Branded illustration of a private conversation.</desc><rect width="800" height="480" fill="#f7f5f2"/><rect x="48" y="48" width="56" height="56" rx="18" fill="#b94735"/><path d="M63 65h26v18H75l-7 6v-6h-5z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><text x="122" y="88" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#253444">Signal Post</text><text x="50" y="153" font-family="Arial,sans-serif" font-size="22" fill="#54616e">A little closer, one message at a time.</text><rect x="50" y="194" width="438" height="66" rx="18" fill="#e6e9eb"/><text x="74" y="235" font-family="Arial,sans-serif" font-size="23" fill="#253444">Hey, good to hear from you.</text><rect x="284" y="282" width="466" height="66" rx="18" fill="#b94735"/><text x="308" y="323" font-family="Arial,sans-serif" font-size="23" fill="#fff">Some conversations are just for us.</text><path d="M50 386h700" stroke="#d8d9d8"/><text x="50" y="425" font-family="Arial,sans-serif" font-size="17" fill="#54616e">REACT / EXPRESS / PASSPORT / POSTGRESQL</text></svg>
